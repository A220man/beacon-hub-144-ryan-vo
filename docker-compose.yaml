version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: beacon-hub-postgres
    environment:
      POSTGRES_DB: beacon_hub
      POSTGRES_USER: beacon_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon_hub -d beacon_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beacon-hub-network
    deploy:
      resources:
        limits:
          memory: 512M

  # Keycloak for OIDC authentication
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: beacon-hub-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-changeme}
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    volumes:
      - keycloak_data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - beacon-hub-network
    deploy:
      resources:
        limits:
          memory: 1G

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beacon-hub-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://beacon_hub:${POSTGRES_PASSWORD:-changeme}@postgres:5432/beacon_hub
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production-min-32-chars}
      ENVIRONMENT: production
      DEBUG: "false"
      OIDC_ENABLED: "true"
      OIDC_ISSUER_URL: http://keycloak:8080/realms/beacon-hub
      OIDC_CLIENT_ID: beacon-hub
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: http://localhost:3000/callback
      OIDC_LOGOUT_URI: http://localhost:3000
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/health/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - beacon-hub-network
    deploy:
      resources:
        limits:
          memory: 512M

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beacon-hub-frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - beacon-hub-network
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  keycloak_data:

networks:
  beacon-hub-network:
    driver: bridge